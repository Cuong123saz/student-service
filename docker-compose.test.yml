name: student-service-test

services:
  postgres:
    image: postgres:17-alpine
    container_name: student-service-postgres-test

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: student_service_test

    ports:
      - "5434:5432"

    tmpfs:
      - /var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d student_service_test
      interval: 2s
      timeout: 2s
      retries: 10