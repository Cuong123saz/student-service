name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: student_service_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d student_service_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare test environment
        run: cp apps/api/.env.test.example apps/api/.env.test

      - name: Typecheck API
        run: npm run typecheck --workspace @student-service/api

      - name: Test API
        run: npm run test --workspace @student-service/api

      - name: Build API
        run: npm run build --workspace @student-service/api

      - name: Test Web
        run: npm run test --workspace @student-service/web

      - name: Build Web
        run: npm run build --workspace @student-service/web
