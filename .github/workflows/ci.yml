name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: student_service_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d student_service_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm

      - name: Enforce Sprint 4 ADR gate
        env:
          ADR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          ADR_HEAD_SHA: ${{ github.sha }}
        run: node scripts/check-sprint4-adr-gate.mjs "$ADR_BASE_SHA" "$ADR_HEAD_SHA"

      - name: Install dependencies
        run: npm ci

      - name: Prepare test environment
        run: cp apps/api/.env.test.example apps/api/.env.test

      - name: Lint repository
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run check

      - name: Test repository
        run: npm run test

      - name: Build repository
        run: npm run build
