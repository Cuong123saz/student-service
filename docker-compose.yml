services:
  postgres:
    image: postgres:17-alpine
    container_name: student-service-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: student_service

    ports:
      - "5433:5432"

    volumes:
      - student_service_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.27.4
    container_name: student-service-mailpit
    restart: unless-stopped

    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  student_service_data:
    external: true
    name: student-service-api_student_service_data